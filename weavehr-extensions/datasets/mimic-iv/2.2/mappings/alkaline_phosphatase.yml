# YAIB adds the lab item 53086 (alkaline phosphatase) to ricu (ricu-extensions/configs/chemistry).
type: simple
mappings:
  - pattern:
      table: labevents
      event: LAB
      code: (50863(//.*)?|53086(//.*)?)
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
